plugins { id 'com.android.application' }
android {
    namespace 'fr.fxextractor'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.fxextractor'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.2.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
