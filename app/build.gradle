plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'fr.fxextractor'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.fxextractor'
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName '0.4.2-sa3-test'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
    androidResources { noCompress 'tflite', 'onnx', 'wasm', 'model' }
}

dependencies {
    // One LiteRT runtime for both existing offline YAMNet and future SA3 CPU.
    // Never bundle both org.tensorflow:tensorflow-lite and LiteRT 2.x (duplicate classes).
    implementation 'com.google.ai.edge.litert:litert:2.3.0'
    // Bundled local Rust tokenizer for T5Gemma SentencePiece-converted tokenizers.json
    implementation 'ai.djl.huggingface:tokenizers:0.33.0'
    implementation 'ai.djl.android:tokenizer-native:0.33.0'
}

// Kotlin LiteRT 2.3 requires modern Kotlin metadata (no old kotlinOptions DSL).
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}
