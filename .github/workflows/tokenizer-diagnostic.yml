name: Diagnose Android DJL tokenizer crash
on:
  push:
    branches: [feature/sa3-tokenizer-crash-fix-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tokenizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check tokenizer version dependencies
        run: |
          gradle :app:dependencies --configuration debugRuntimeClasspath | grep -Ei 'djl|tokenizer|slf4j|kotlin-stdlib' || true
      - name: Assemble small diagnostic APK without downloading 1.26GB models
        run: gradle --no-daemon :app:assembleDebug
      - name: Inspect compiled DEX class and Android native library
        run: |
          python3 - <<'PY'
          import zipfile
          p='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              for suffix in ['libdjl_tokenizer.so','libc++_shared.so','liblitert_jni.so']:
                  print('JNI',suffix,[n for n in names if n.endswith(suffix)],flush=True)
              classes=['ai/djl/huggingface/tokenizers/jni/LibUtils',
                       'ai/djl/huggingface/tokenizers/HuggingFaceTokenizer',
                       'ai/djl/huggingface/tokenizers/jni/TokenizersLibrary']
              for cls in classes:
                  found=[name for name in names if name.endswith('.dex') and cls.encode() in z.read(name)]
                  print('DEX',cls,found,flush=True)
                  if not found: raise AssertionError('Missing class in final APK: '+cls)
              abis={n.split('/')[1] for n in names if n.startswith('lib/') and n.endswith('libdjl_tokenizer.so')}
              print('Tokenizer JNI ABIs',abis,flush=True)
              assert 'arm64-v8a' in abis,'Missing 64-bit native tokenizer'
          PY
