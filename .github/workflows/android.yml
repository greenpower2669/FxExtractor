name: FxExtractor Android and DSP tests
on:
  push:
    branches: [main, feature/audio-fx-analyzer-v1, feature/midi-ai-v5-test, feature/stable-audio3-local-v1, feature/stable-audio3-full-apk-v1, feature/sa3-tokenizer-crash-fix-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Optional Qwen adapter syntax
        run: python3 -m py_compile tools/qwen_tag_fx.py
      - name: Pure Java WAV / FX tests
        run: |
          mkdir -p build/dsp-test
          javac -d build/dsp-test app/src/main/java/fr/fxextractor/FxAnalyzer.java app/src/main/java/fr/fxextractor/WavIO.java app/src/main/java/fr/fxextractor/FxCli.java tools/TestFxAnalyzer.java
          java -cp build/dsp-test TestFxAnalyzer
      - name: Real Stable Audio sampler and WAV unit tests
        run: |
          mkdir -p build/sa3-test
          javac -d build/sa3-test app/src/main/java/fr/fxextractor/StableAudioMath.java tools/TestStableAudioMath.java
          java -cp build/sa3-test TestStableAudioMath
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Only to update isolated APK delivery branch, never main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Embed official Google YAMNet model and labels for offline Android AI
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 'https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite' -o app/src/main/assets/yamnet.tflite
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          p = pathlib.Path('app/src/main/assets/yamnet.tflite')
          data = p.read_bytes()
          assert 1_000_000 < len(data) < 24_000_000, f'Unexpected YAMNet size: {len(data)}'
          assert data[4:8] == b'TFL3', 'Not a TensorFlow Lite model'
          print('YAMNet SHA256:', hashlib.sha256(data).hexdigest())
          assert hashlib.sha256(data).hexdigest() == '4d8b4a53282dc83ef04e3e7dbc4fbc98082e34e44ed798e16c3a0cdd4c584faf', 'YAMNet model SHA256 mismatch'
          with zipfile.ZipFile(p) as z:
              files = z.namelist()
              print('Embedded model metadata assets:', files)
              candidates = [name for name in files if name.endswith('yamnet_label_list.txt')]
              if not candidates:
                  candidates = [name for name in files if name.endswith('.txt')]
              assert candidates, 'Missing embedded YAMNet AudioSet labels'
              labels = z.read(candidates[0]).decode('utf-8-sig')
          rows = [row for row in labels.splitlines() if row.strip()]
          assert len(rows) == 521, f'Expected 521 labels, got {len(rows)}'
          pathlib.Path('app/src/main/assets/yamnet_labels.txt').write_text(
              '\n'.join(rows) + '\n', encoding='utf-8')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute actual YAMNet inference smoke test
        run: |
          python3 -m pip install --quiet 'ai-edge-litert' numpy
          python3 tools/test_yamnet_model.py
      - name: Build and test real MP3 Shine encoder
        run: bash tools/build_shine.sh
      - name: Verify official SA3 SentencePiece and bundle exact offline tokenizer
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/sa3
          curl -fL --retry 3 --connect-timeout 20 --max-time 180             'https://raw.githubusercontent.com/Stability-AI/stable-audio-3/main/optimized/tflite/models/tokenizer.model'             -o app/src/main/assets/sa3/tokenizer.model
          python3 -m pip install --disable-pip-version-check --quiet             'transformers==4.57.1' 'sentencepiece==0.2.1' 'tokenizers==0.22.1' 'protobuf==4.25.8'
          python3 tools/build_sa3_tokenizer.py             --source app/src/main/assets/sa3/tokenizer.model             --out app/src/main/assets/sa3/tokenizer.json
      - name: Package pinned MIDI Gen AI v5 web inference engine
        run: |
          set -euo pipefail
          UPSTREAM='17c7fb775789089dc848eb13b5fd477657f024ab'
          DIR='app/src/main/assets/midi'
          mkdir -p "$DIR"
          for name in midigen-web.mjs tasks.mjs midi.mjs tokenizer.mjs attributes.mjs generator.mjs; do
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 \
              "https://raw.githubusercontent.com/nicholasbien/midigenai/$UPSTREAM/midigenai/web/$name" -o "$DIR/$name"
            node --check "$DIR/$name"
          done
          npm install --prefix "$RUNNER_TEMP/midi-deps" --no-audit --no-fund --no-save 'onnxruntime-web@1.30.0'
          ORT="$RUNNER_TEMP/midi-deps/node_modules/onnxruntime-web/dist"
          cp "$ORT/ort.wasm.bundle.min.mjs" "$DIR/"
          cp "$ORT/ort-wasm-simd-threaded.wasm" "$DIR/"
          # The Android WebView loads this exact packaged WASM via wasmBinary.
          python3 tools/embed_midi_model.py
          node --check "$DIR/main.mjs"
          node tools/test_midi_ui.mjs
          node --check "$DIR/ort.wasm.bundle.min.mjs"
          test -s "$DIR/ort-wasm-simd-threaded.wasm"
          test -s "$DIR/v5/tokenizer.json"
          test -s "$DIR/v5/onnx/manifest.json"
          # Browser integration test: actually start the large MIDI v5 ONNX session
          # using the same JS and WASM files included in the APK.
          npm install --no-save --no-package-lock --ignore-scripts 'playwright@1.56.1'
          npx playwright install --with-deps chromium
          node tools/test_midi_browser.mjs
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('app/src/main/assets/midi')
          m=json.loads((root/'v5/onnx/manifest.json').read_text())
          f=m['files']['cpu']
          blob=root/'v5/onnx'/f['file']
          assert blob.stat().st_size == f['bytes']
          assert blob.is_file()
          magic=(root/'ort-wasm-simd-threaded.wasm').read_bytes()[:4]
          assert magic == b'\x00asm', f'WASM invalid: {magic!r}'
          print('MIDI OFFLINE ASSETS OK',blob.stat().st_size)
          PY
      - name: Download authentic SA3 offline models and all licences for full APK
        if: github.ref == 'refs/heads/feature/stable-audio3-full-apk-v1' || github.ref == 'refs/heads/feature/sa3-tokenizer-crash-fix-v1'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'huggingface_hub>=0.36,<2.0'
          python3 tools/package_sa3_models.py \
            --assets app/src/main/assets --cache "$RUNNER_TEMP/sa3_hub_cache" --include-license-notices
          python3 tools/verify_sa3_model_pack.py --with-licenses \
            --assets app/src/main/assets --manifest app/src/main/assets/sa3/weights-manifest.json
      - name: Build APK and AAB
        run: |
          if [[ "$GITHUB_REF" == 'refs/heads/feature/stable-audio3-full-apk-v1' || "$GITHUB_REF" == 'refs/heads/feature/sa3-tokenizer-crash-fix-v1' ]]; then
            gradle --no-daemon :app:assembleDebug
          else
            gradle --no-daemon :app:assembleDebug :app:bundleRelease
          fi
      - name: Verify full APK contains all actual models and license texts
        if: github.ref == 'refs/heads/feature/stable-audio3-full-apk-v1' || github.ref == 'refs/heads/feature/sa3-tokenizer-crash-fix-v1'
        run: |
          python3 - <<'PY'
          import zipfile,hashlib,json
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as z:
              manifest=json.loads(z.read('assets/sa3/weights-manifest.json'))
              assert len(manifest['files'])==5
              for asset,meta in manifest['files'].items():
                  zipped='assets/'+asset
                  h=hashlib.sha256(); length=0
                  with z.open(zipped) as f:
                      for piece in iter(lambda:f.read(8*1024*1024),b''):
                          h.update(piece);length+=len(piece)
                  assert length==meta['bytes'] and h.hexdigest()==meta['sha256'],asset
                  if zipped.endswith('.tflite'): assert z.getinfo(zipped).compress_type==zipfile.ZIP_STORED
                  print('CHECKED MODEL',asset,length,flush=True)
              for document in ['NOTICE','LICENSE.md','LICENSE_GEMMA.md','tokenizer.json']:
                  assert 'assets/sa3/'+document in z.namelist()
              print('FULL 5-model APK validated',manifest['revision'])
          PY
      - name: Extract APK on GitHub into a temporary folder
        run: |
          mkdir -p dist "$RUNNER_TEMP/fx-packed" "$RUNNER_TEMP/fx-unpacked"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/fx-packed/FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk"
          (cd "$RUNNER_TEMP/fx-packed" && zip -q "$RUNNER_TEMP/fx-packed.zip" FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk)
          unzip -q "$RUNNER_TEMP/fx-packed.zip" -d "$RUNNER_TEMP/fx-unpacked"
          cmp "$RUNNER_TEMP/fx-unpacked/FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk" app/build/outputs/apk/debug/app-debug.apk
          unzip -tqq "$RUNNER_TEMP/fx-unpacked/FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk"
          unzip -Z1 "$RUNNER_TEMP/fx-unpacked/FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk" | grep -Fx 'assets/yamnet.tflite'
          unzip -Z1 "$RUNNER_TEMP/fx-unpacked/FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk" | grep -Fx 'assets/midi/main.mjs'
          unzip -Z1 "$RUNNER_TEMP/fx-unpacked/FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk" | grep -Fx 'assets/midi/index.html'
          unzip -Z1 "$RUNNER_TEMP/fx-unpacked/FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk" | grep -Fx 'assets/midi/ort-wasm-simd-threaded.wasm'
          # Verify the exact CPU ONNX bytes and tokenizer were packaged.
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          apk=pathlib.Path('dist/FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk')
          if not apk.exists(): apk=pathlib.Path('app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              assert 'assets/midi/v5/onnx/manifest.json' in names
              assert 'assets/midi/v5/tokenizer.json' in names
              manifest=json.loads(z.read('assets/midi/v5/onnx/manifest.json'))
              info=manifest['files']['cpu']
              expected='assets/midi/v5/onnx/'+info['file']
              assert expected in names
              h=hashlib.sha256()
              size=0
              with z.open(expected) as f:
                  for part in iter(lambda:f.read(4*1024*1024),b''):
                      h.update(part);size+=len(part)
              assert size==info['bytes']
              assert h.hexdigest()==info['sha256']
              assert z.read('assets/midi/ort-wasm-simd-threaded.wasm')[:4]==b'\x00asm'
              print('APK OFFLINE MIDI VERIFIED:',size,'bytes of model,',h.hexdigest())
          PY
          unzip -Z1 "$RUNNER_TEMP/fx-unpacked/FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk" | grep -Fx 'assets/yamnet_labels.txt'
          unzip -Z1 "$RUNNER_TEMP/fx-unpacked/FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk" | grep -Fx 'lib/arm64-v8a/libshinefx.so'
          unzip -Z1 "$RUNNER_TEMP/fx-unpacked/FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk" | grep -Fx 'assets/shine_lgpl_v2.txt'
          cp "$RUNNER_TEMP/fx-unpacked/FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk" dist/
          sha256sum dist/FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk > dist/SHA256SUMS.txt
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            sha256sum app/build/outputs/bundle/release/app-release.aab >> dist/SHA256SUMS.txt
          fi
          test -s dist/FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk
      - name: Publish raw APK to isolated GitHub delivery branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/midi-ai-v5-test'
        run: |
          set -euo pipefail
          # GitHub rejects Git blobs above 100 MB. The full CPU checkpoint
          # makes the APK larger than that; the file itself is still published
          # directly (archive:false) by the Actions artifact below.
          SIZE=$(stat -c%s dist/FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk)
          if [ "$SIZE" -ge 100000000 ]; then
            echo "APK has $SIZE bytes (> GitHub 100 MB Git blob limit)."
            echo "Publish via Actions raw artifact (archive:false), not the delivery git branch."
            exit 0
          fi
          git fetch origin 'refs/heads/delivery/fxextractor-apk:refs/remotes/origin/delivery/fxextractor-apk'
          git worktree add -B delivery/fxextractor-apk "$RUNNER_TEMP/fx-delivery" origin/delivery/fxextractor-apk
          mkdir -p "$RUNNER_TEMP/fx-delivery/apk"
          cp dist/FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk "$RUNNER_TEMP/fx-delivery/apk/FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk"
          git -C "$RUNNER_TEMP/fx-delivery" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/fx-delivery" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/fx-delivery" add apk/FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk
          git -C "$RUNNER_TEMP/fx-delivery" commit -m "build: FxExtractor 0.4.0 SA3 FOUNDATION verified APK ($GITHUB_SHA)"
          git -C "$RUNNER_TEMP/fx-delivery" push origin HEAD:refs/heads/delivery/fxextractor-apk
          echo "Direct APK: https://raw.githubusercontent.com/$GITHUB_REPOSITORY/delivery/fxextractor-apk/apk/FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk"
      - uses: actions/upload-artifact@v7
        with:
          path: dist/FxExtractor-0.4.3-SA3-TOKENIZER-FIX-TEST-debug.apk
          archive: false
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/bundle/release/app-release.aab
          archive: false
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          path: dist/SHA256SUMS.txt
          archive: false
          retention-days: 30
